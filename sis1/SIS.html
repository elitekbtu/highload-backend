;exitY=1;exitDx=0;exitDy=0;\&quot; target=\&quot;Nd6-AkbvBs5EHSLaePul-2\&quot; value=\&quot;\&quot;&gt;&lt;mxGeometry height=\&quot;50\&quot; relative=\&quot;1\&quot; width=\&quot;50\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;351\&quot; y=\&quot;320\&quot; as=\&quot;sourcePoint\&quot;/&gt;&lt;mxPoint x=\&quot;401\&quot; y=\&quot;270\&quot; as=\&quot;targetPoint\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nd6-AkbvBs5EHSLaePul-6\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;Nd6-AkbvBs5EHSLaePul-2\&quot; style=\&quot;endArrow=none;html=1;rounded=0;exitX=0;exitY=0.141;exitDx=0;exitDy=0;entryX=1;entryY=0.141;entryDx=0;entryDy=0;\&quot; target=\&quot;Nd6-AkbvBs5EHSLaePul-2\&quot; value=\&quot;\&quot;&gt;&lt;mxGeometry height=\&quot;50\&quot; relative=\&quot;1\&quot; width=\&quot;50\&quot; as=\&quot;geometry\&quot;&gt;&lt;mxPoint x=\&quot;351\&quot; y=\&quot;320\&quot; as=\&quot;sourcePoint\&quot;/&gt;&lt;mxPoint x=\&quot;401\&quot; y=\&quot;270\&quot; as=\&quot;targetPoint\&quot;/&gt;&lt;/mxGeometry&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nd6-AkbvBs5EHSLaePul-7\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;\&quot; value=\&quot;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;Functional Requirements&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;40\&quot; width=\&quot;320\&quot; x=\&quot;81\&quot; y=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nd6-AkbvBs5EHSLaePul-8\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;fontFamily=Comic Sans MS;\&quot; value=\&quot;Non-Functional Requirements\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;40\&quot; width=\&quot;320\&quot; x=\&quot;401\&quot; y=\&quot;120\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nd6-AkbvBs5EHSLaePul-9\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=left;verticalAlign=top;rounded=0;fontFamily=Comic Sans MS;\&quot; value=\&quot;1) User should be able to like and unlike a post, One user can like a post only once&amp;lt;div&amp;gt;2)&amp;amp;nbsp;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;A view is counted only when the post is visible on screen for at least 2 s. The same user’s views of one post are counted at most once per 1 h for deduplication&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;3) User should be able to get count of likes and view of a post&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;and&amp;lt;/font&amp;gt;&amp;lt;span style=&amp;quot;font-family: -webkit-standard; font-size: medium;&amp;quot;&amp;gt; &amp;lt;/span&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;whether they liked the post&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;4)&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;Users should be able to get counters for many posts in one request (for the feed)&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;200\&quot; width=\&quot;280\&quot; x=\&quot;101\&quot; y=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nd6-AkbvBs5EHSLaePul-10\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=left;verticalAlign=top;rounded=0;fontFamily=Comic Sans MS;\&quot; value=\&quot;1)&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;amp;nbsp;~20,000 RPS on increments (likes + views)&amp;lt;/font&amp;gt;&amp;lt;div&amp;gt;2)&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;amp;nbsp;~44&amp;lt;/font&amp;gt;,000&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;amp;nbsp;RPS on reads (assumption: counters are shown on every post in the feed)&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;3)&amp;amp;nbsp;Data volume: 50M objects (posts) with counters.&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;4)&amp;amp;nbsp;Eventual consistency: a counter must show a new like or view within ≤ 2 s.&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;5)&amp;amp;nbsp;Low latency on reads: getting counters &amp;amp;lt; 50 ms (p99).&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;6) High availability:&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;99.99% uptime. A&amp;lt;/font&amp;gt;&amp;amp;nbsp;failure of one component should not lose events.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;7) Likes must be exact. Views can have a small error (&amp;amp;lt; 1%).&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;200\&quot; width=\&quot;280\&quot; x=\&quot;415\&quot; y=\&quot;170\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nd6-AkbvBs5EHSLaePul-11\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=center;verticalAlign=middle;rounded=0;fontFamily=Verdana;fontStyle=1\&quot; value=\&quot;&amp;lt;div style=&amp;quot;text-align: start;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot; style=&amp;quot;font-size: 24px;&amp;quot;&amp;gt;Capacity estimates&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;40\&quot; width=\&quot;240\&quot; x=\&quot;281\&quot; y=\&quot;480\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;Nd6-AkbvBs5EHSLaePul-12\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;whiteSpace=wrap;strokeColor=none;fillColor=none;align=left;verticalAlign=top;rounded=0;\&quot; value=\&quot;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;font-family: Comic Sans MS;&amp;quot;&amp;gt;Write(view) request per second = 20,000 RPS * 0.9 (90%) = &amp;lt;/span&amp;gt;&amp;lt;i style=&amp;quot;font-family: Comic Sans MS;&amp;quot;&amp;gt;18,000&amp;lt;/i&amp;gt;&amp;lt;span style=&amp;quot;font-family: Comic Sans MS;&amp;quot;&amp;gt; requests -&amp;amp;gt; on peak 18,000 * 3 = &amp;lt;/span&amp;gt;&amp;lt;i style=&amp;quot;font-family: Comic Sans MS;&amp;quot;&amp;gt;54,000&amp;lt;/i&amp;gt;&amp;lt;span style=&amp;quot;font-family: Comic Sans MS;&amp;quot;&amp;gt; requests&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;Write(like) request per second = 20,000 RPS * 0.1 (10%) = &amp;lt;i&amp;gt;2,000&amp;lt;/i&amp;gt; requests -&amp;amp;gt; on peak 2,000 * 3 = &amp;lt;i&amp;gt;6000&amp;lt;/i&amp;gt; requests&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;All requests per day = 20,000 RPS * 86,400 s = &amp;lt;i&amp;gt;1,728,000,000&amp;lt;/i&amp;gt; request per day&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;b&amp;gt;View function:&amp;lt;/b&amp;gt;&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;ol&amp;gt;&amp;lt;li style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;User see a post and send HTTP request to server POST -&amp;amp;gt; api/v1/view_started. As answer sever sends token which contains user_id and post_id. (1 HTTP request)&amp;lt;/font&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;li style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;After 2 seconds if user still watch this post, user send new HTTP request POST -&amp;amp;gt; api/v1/view_finished with token. Server checks token and real time between &amp;amp;nbsp;view started and view finished. If all true, then it send to other service &amp;amp;nbsp;Kafka event to increment view by 1. (1 HTTP request)&amp;lt;/font&amp;gt;&amp;lt;/li&amp;gt;&amp;lt;/ol&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;So for one increment view we need 2 real HTTP request, but if user just scroll feed without stoping to post more that 2 seconds, so it will only 1 HTTP request.&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Real HTTP RPS (view)&amp;amp;nbsp;&amp;lt;/b&amp;gt;&amp;amp;nbsp;= 18,000 RPS * 2 + 10,800 RPS (&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;assume 60% extra view_started from users who scroll past&amp;lt;/font&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;amp;nbsp;) = ~ &amp;lt;i&amp;gt;47,000&amp;lt;/i&amp;gt; RPS&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;On Peak = 47,000 * 3 = &amp;lt;i&amp;gt;141,000&amp;lt;/i&amp;gt; RPS&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Read counters per second&amp;lt;/b&amp;gt;&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;font face=&amp;quot;Comic Sans MS&amp;quot;&amp;gt;&amp;amp;nbsp;Post impressions&amp;amp;nbsp;&amp;lt;/font&amp;gt;&amp;lt;span style=&amp;quot;font-family: Comic Sans MS;&amp;quot;&amp;gt;= 18,000 RPS + 10,800 RPS = ~&amp;lt;i&amp;gt;29,000&amp;lt;/i&amp;gt; RPS&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div style=&amp;quot;text-align: justify;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;font-family: Comic Sans MS;&amp;quot;&amp;gt;Assume that we have other sources to read a like profile or search so =&am
