[project]
name = "sis1"
version = "0.1.0"
description = "like and views counter by Turarbek Satbaldiyev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15,<2",
    "aiokafka[lz4]>=0.12,<1",
    "asyncpg>=0.30,<1",
    "greenlet>=3.1",
    "prometheus-client>=0.21,<1",
    "redis>=5,<9",
    "fastapi>=0.143.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires the Docker Compose services"]
