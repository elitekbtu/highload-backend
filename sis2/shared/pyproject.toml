[project]
name = "shared"
version = "0.1.0"
description = "Kafka event schema, DB models and sharding shared by all services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
