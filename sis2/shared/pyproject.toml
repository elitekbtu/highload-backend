[project]
name = "shared"
version = "0.1.0"
description = "Kafka event schema, DB models and sharding shared by all services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
