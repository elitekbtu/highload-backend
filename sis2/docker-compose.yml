x-app-env: &app-env
  DATABASE_URLS: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-app}@pg-0:5432/counters,postgresql+asyncpg://app:${POSTGRES_PASSWORD:-app}@pg-1:5432/counters
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: counter-events

x-postgres: &postgres
  image: postgres:18-alpine
  command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
  shm_size: 256m
  deploy: { resources: { limits: { memory: 1g } } }
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    POSTGRES_DB: counters
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "app", "-d", "counters"]
    interval: 2s
    retries: 15

services:
  gateway:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    deploy: { resources: { limits: { memory: 64m } } }
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [write_service, read_service]

  write_service:
    build: { context: ., dockerfile: services/write_service/Dockerfile }
    deploy: { resources: { limits: { memory: 256m } } }
    environment:
      <<: *app-env
      VIEW_TOKEN_SECRET: ${VIEW_TOKEN_SECRET:-change-me}
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  read_service:
    build: { context: ., dockerfile: services/read_service/Dockerfile }
    deploy: { resources: { limits: { memory: 256m } } }
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      pg-0: { condition: service_healthy }
      pg-1: { condition: service_healthy }

  aggregator:
    build: { context: ., dockerfile: services/aggregator/Dockerfile }
    deploy: { resources: { limits: { memory: 256m } } }
    environment: *app-env
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      pg-0: { condition: service_healthy }
      pg-1: { condition: service_healthy }

  kafka:
    image: apache/kafka-native:4.1.0
    deploy: { resources: { limits: { memory: 1g } } }
    volumes:
      - ./infra/kafka/server.properties:/mnt/shared/config/server.properties:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    deploy: { resources: { limits: { memory: 640m } } }
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  pg-0:
    <<: *postgres
    volumes:
      - pg-0:/var/lib/postgresql
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro

  pg-1:
    <<: *postgres
    volumes:
      - pg-1:/var/lib/postgresql
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro

volumes:
  pg-0:
  pg-1:
