services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["8080:80", "8081:81"]
    deploy: { resources: { limits: { memory: 64m } } }
    volumes:
      - ../services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      write_service: { condition: service_healthy }
      read_service: { condition: service_healthy }
