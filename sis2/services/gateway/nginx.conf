worker_processes auto;

events {
    worker_connections 8192;
}

http {
    access_log off;

    resolver 127.0.0.11 valid=5s ipv6=off;

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;

    upstream write_service { zone write_service 64k; server write_service:8000 resolve; keepalive 64; }
    upstream read_service  { zone read_service 64k;  server read_service:8000 resolve;  keepalive 64; }

    server {
        listen 80;

        limit_req zone=per_ip burst=100 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        location ~ ^/api/v1/posts/\d+/(like|view_started|view_finished)$ {
            proxy_pass http://write_service;
        }

        location ~ ^/api/v1/(posts/\d+/)?counters$ {
            proxy_pass http://read_service;
        }

        location / {
            return 404;
        }
    }
}
