[project]
name = "sis2"
version = "0.1.0"
description = "Like & View counter by Turarbek Satbaldiyev"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "services/write_service", "services/read_service", "services/aggregator", "infra/postgres"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires the Docker Compose services"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
